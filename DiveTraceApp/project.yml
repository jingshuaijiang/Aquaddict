name: DiveTrace
options:
  bundleIdPrefix: com.jjsbanana
  deploymentTarget:
    iOS: "17.0"
packages:
  DiveKit:
    path: ../DiveKit
targets:
  DiveTrace:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: DiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjsbanana.divetrace
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        # local-only app, standard HTTPS at most — skips the export question every upload
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Aquaddict
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: "拍摄潜水照片 / Take photos for your dive log"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "连接 Shearwater 潜水电脑下载潜水日志 / Connects to your Shearwater dive computer to download dive logs"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 25R2A5LGHQ
